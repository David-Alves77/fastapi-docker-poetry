
[tool.poetry]
name = "fastapi-docker-poetry"
version = "0.1.0"
description = "API FastAPI com Docker e Poetry"
authors = ["Aluno EBAC"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115,<1.0"
uvicorn = ">=0.34,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
